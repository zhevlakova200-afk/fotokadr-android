# ФотоКадр: короткий файл сборки APK.
# Замените им .github/workflows/fotokadr-apk.yml и сохраните в main.
# Полный проект берётся из первой сохранённой версии вашего репозитория.
# Исправление компиляции Java включено. Модель будет встроена в APK.

name: FotoKadr - build installable APK
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e741bbdafd6282e1883f69ef2d7e6cc287471ad6
    - name: Restore source and fix Java compilation
      working-directory: .
      run: |
        python3 - <<'PY'
        from pathlib import Path, PurePosixPath
        import base64, hashlib, io, lzma, re, tarfile, zipfile

        # The first complete workflow remains available at this pinned commit.
        workflow = Path('.github/workflows/fotokadr-apk.yml').read_text(encoding='utf-8')
        match = re.search(r'encoded = """(.*?)"""', workflow, re.S)
        if match is None:
            raise SystemExit('Complete embedded project not found in the pinned commit.')
        packed = base64.b64decode(''.join(match.group(1).split()), validate=True)
        if hashlib.sha256(packed).hexdigest() != 'a7d013ef50ffde6b3ed417adfcdb1f785aa4baecec35c35be4ebe5ad236e5848':
            raise SystemExit('Embedded source checksum mismatch.')

        old = """    # Android supplies its own Java API stubs; do not depend on the host JDK's
            # optional historical ct.sym archive (which managed images may omit).
            run(*compiler, '-encoding', 'UTF-8', '-source', '8', '-target', '8', '-bootclasspath', platform,
                '-Xlint:-options', '-d', stage / 'classes', *java_sources)
        """
        new = """    # Use the JDK's complete Java 8 API for lambda bootstrap methods, and the
            # Android SDK on the classpath for android.* APIs. android.jar alone is not
            # a complete Java bootstrap classpath (LambdaMetafactory is missing).
            run(*compiler, '-encoding', 'UTF-8', '--release', '8', '-classpath', platform,
                '-d', stage / 'classes', *java_sources)
        """
        files = []
        seen = set()
        with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as archive:
            for entry in archive:
                path = PurePosixPath(entry.name)
                if (not entry.isfile() or path.is_absolute() or '..' in path.parts
                        or len(path.parts) < 2 or path.parts[0] != 'fotokadr'
                        or '\\' in entry.name or entry.name in seen):
                    raise SystemExit('Invalid embedded source path.')
                seen.add(entry.name)
                data = archive.extractfile(entry).read()
                if entry.name == 'fotokadr/scripts/build-android.py':
                    code = data.decode('utf-8')
                    if code.count(old) != 1:
                        raise SystemExit('Unexpected Java build script: fix was not applied.')
                    data = code.replace(old, new).encode('utf-8')
                files.append((entry.name, data, entry.mode))
        if len(files) != 37:
            raise SystemExit('Incomplete source project.')
        if Path('fotokadr').exists():
            raise SystemExit('The output folder already exists.')
        with zipfile.ZipFile('fotokadr-source-1.4.0.zip', 'x', compression=zipfile.ZIP_DEFLATED) as output:
            for name, data, mode in files:
                path = Path(name)
                path.parent.mkdir(parents=True, exist_ok=True)
                with path.open('xb') as handle:
                    handle.write(data)
                path.chmod(mode & 0o777)
                output.writestr(name, data)
        print('Restored 37 files and applied the Java compilation fix.')
        PY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore downloaded model and runtime
      uses: actions/cache@v4
      with:
        path: |-
          fotokadr/dist/models
          fotokadr/dist/vendor/onnxruntime
          fotokadr/dist/offline-assets.json
        key: fotokadr-model-modnet-7e0f55f-ort-1.20.1-v1
    - name: Restore Android build tools
      uses: actions/cache@v4
      with:
        path: fotokadr/build/android-sdk
        key: fotokadr-sdk-35-tools-35.0.0-linux-v1
    - name: Download and verify offline model and runtime
      run: python scripts/fetch-offline-assets.py
    - name: Install verified Android build tools
      run: python scripts/setup-android-sdk.py --sdk build/android-sdk
    - name: Test editor and Android saving
      run: npm test
    - name: Prepare signing
      env:
        FOTOKADR_KEYSTORE_B64: ${{ secrets.FOTOKADR_KEYSTORE_B64 }}
        FOTOKADR_SIGNING_CONFIG_B64: ${{ secrets.FOTOKADR_SIGNING_CONFIG_B64 }}
      run: |
        python - <<'PY'
        from pathlib import Path
        import base64, json, os
        directory = Path(os.environ['RUNNER_TEMP']) / 'fotokadr-signing'
        key = os.environ.get('FOTOKADR_KEYSTORE_B64', '')
        config = os.environ.get('FOTOKADR_SIGNING_CONFIG_B64', '')
        if bool(key) != bool(config):
            raise SystemExit('Both signing secrets must be configured together.')
        if key:
            directory.mkdir(mode=0o700, parents=True, exist_ok=True)
            settings = base64.b64decode(config, validate=True)
            if not json.loads(settings).get('password'):
                raise SystemExit('Signing configuration has no password.')
            for name, data in [('fotokadr.p12', base64.b64decode(key, validate=True)), ('signing.json', settings)]:
                with os.fdopen(os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
                    output.write(data)
        else:
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                summary.write('This installation build uses a temporary signing key. Future builds require reinstalling unless persistent signing secrets are configured.\n')
        PY
    - name: Build and verify signed offline APK
      run: python scripts/build-android.py --sdk build/android-sdk --signing-dir "$RUNNER_TEMP/fotokadr-signing" --output
        build/release
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-android-apk
        path: |-
          fotokadr/build/release/*.apk
          fotokadr/build/release/*.apk.sha256
        if-no-files-found: error
        retention-days: 30
    - name: Upload source archive
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-source-project
        path: fotokadr-source-1.4.0.zip
        if-no-files-found: error
        retention-days: 30
    defaults:
      run:
        working-directory: fotokadr
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/fotokadr-apk.yml
concurrency:
  group: fotokadr-apk-${{ github.ref }}
  cancel-in-progress: true
  
