# ФотоКадр 1.4.1: исправление белого фона, модель работает без интернета.
# Замените .github/workflows/fotokadr-apk.yml целиком и сохраните в main.
# Полные исходники восстанавливаются из предыдущей версии репозитория.
# Включены проверка целостности и тест настоящей модели MODNet.

