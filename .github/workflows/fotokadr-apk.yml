        packed = base64.b64decode(''.join(encoded.split()), validate=True)
        if hashlib.sha256(packed).hexdigest() != 'a7d013ef50ffde6b3ed417adfcdb1f785aa4baecec35c35be4ebe5ad236e5848':
            raise SystemExit('Embedded project checksum mismatch.')
        files = []
        seen = set()
        with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as source:
            for entry in source:
                path = PurePosixPath(entry.name)
                if (not entry.isfile() or path.is_absolute() or '..' in path.parts
                        or not path.parts or path.parts[0] != 'fotokadr'
                        or len(path.parts) < 2 or '\\' in entry.name
                        or entry.name in seen):
                    raise SystemExit('Invalid embedded project path.')
                seen.add(entry.name)
                files.append((entry.name, source.extractfile(entry).read(), entry.mode))
        if len(files) != 37:
            raise SystemExit('Incomplete embedded project.')
        if Path('fotokadr').exists():
            raise SystemExit('The fotokadr output folder already exists.')
        with zipfile.ZipFile('fotokadr-source-1.4.0.zip', 'x', compression=zipfile.ZIP_DEFLATED) as output:
            for name, content, mode in files:
                path = Path(name)
                path.parent.mkdir(parents=True, exist_ok=True)
                with path.open('xb') as handle:
                    handle.write(content)
                path.chmod(mode & 0o777)
                output.writestr(name, content)
        print('Restored all 37 project files; source archive also saved.')
        PY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore downloaded model and runtime
      uses: actions/cache@v4
      with:
        path: |-
          fotokadr/dist/models
          fotokadr/dist/vendor/onnxruntime
          fotokadr/dist/offline-assets.json
        key: fotokadr-model-modnet-7e0f55f-ort-1.20.1-v1
    - name: Restore Android build tools
      uses: actions/cache@v4
      with:
        path: fotokadr/build/android-sdk
        key: fotokadr-sdk-35-tools-35.0.0-linux-v1
    - name: Download and verify offline model and runtime
      run: python scripts/fetch-offline-assets.py
    - name: Install verified Android build tools
      run: python scripts/setup-android-sdk.py --sdk build/android-sdk
    - name: Test editor and Android saving
      run: npm test
    - name: Prepare signing
      env:
        FOTOKADR_KEYSTORE_B64: ${{ secrets.FOTOKADR_KEYSTORE_B64 }}
        FOTOKADR_SIGNING_CONFIG_B64: ${{ secrets.FOTOKADR_SIGNING_CONFIG_B64 }}
      run: |
        python - <<'PY'
        from pathlib import Path
        import base64, json, os
        directory = Path(os.environ['RUNNER_TEMP']) / 'fotokadr-signing'
        key = os.environ.get('FOTOKADR_KEYSTORE_B64', '')
        config = os.environ.get('FOTOKADR_SIGNING_CONFIG_B64', '')
        if bool(key) != bool(config):
            raise SystemExit('Both signing secrets must be configured together.')
        if key:
            directory.mkdir(mode=0o700, parents=True, exist_ok=True)
            settings = base64.b64decode(config, validate=True)
            if not json.loads(settings).get('password'):
                raise SystemExit('Signing configuration has no password.')
            for name, data in [('fotokadr.p12', base64.b64decode(key, validate=True)), ('signing.json', settings)]:
                with os.fdopen(os.open(directory / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
                    output.write(data)
        else:
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                summary.write('This installation build uses a temporary signing key. Future builds require reinstalling unless persistent signing secrets are configured.\n')
        PY
    - name: Build and verify signed offline APK
      run: python scripts/build-android.py --sdk build/android-sdk --signing-dir "$RUNNER_TEMP/fotokadr-signing" --output
        build/release
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-android-apk
        path: |-
          fotokadr/build/release/*.apk
          fotokadr/build/release/*.apk.sha256
        if-no-files-found: error
        retention-days: 30
    - name: Upload source archive
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-source-project
        path: fotokadr-source-1.4.0.zip
        if-no-files-found: error
        retention-days: 30
    defaults:
      run:
        working-directory: fotokadr
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/fotokadr-apk.yml
concurrency:
  group: fotokadr-apk-${{ github.ref }}
  cancel-in-progress: true
