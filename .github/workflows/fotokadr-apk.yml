        match = re.search(r'encoded = """(.*?)"""', workflow, re.S)
        if match is None:
            raise SystemExit('Complete source project not found in the pinned commit.')
        packed = base64.b64decode(''.join(match.group(1).split()), validate=True)
        if hashlib.sha256(packed).hexdigest() != 'a7d013ef50ffde6b3ed417adfcdb1f785aa4baecec35c35be4ebe5ad236e5848':
            raise SystemExit('Original source checksum mismatch.')

        def valid_path(name):
            path = PurePosixPath(name)
            return (not path.is_absolute() and '..' not in path.parts and len(path.parts) >= 2
                    and path.parts[0] == 'fotokadr' and '\\' not in name)

        files = {}
        with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed)), mode='r:') as archive:
            for entry in archive:
                if not entry.isfile() or not valid_path(entry.name) or entry.name in files:
                    raise SystemExit('Invalid source path.')
