        """
        # Apply the verified 1.6.1 theme patch to the verified 1.6.0 source.
        theme_patch = base64.b64decode(''.join(theme_patch.split()), validate=True)
        assert hashlib.sha256(theme_patch).hexdigest() == 'a6236556b17069566132cfeb5f23b82fafc70a132178b300917b58573572765b', 'Theme update checksum mismatch'
        for update in json.loads(lzma.decompress(theme_patch)):
            target = Path(update['path'])
            assert not target.is_absolute() and target.parts[0] == 'fotokadr' and '..' not in target.parts
            if 'text' in update:
                assert not target.exists(), 'Unexpected existing theme file'
                data = update['text'].encode('utf-8')
            else:
                before = target.read_bytes()
                assert hashlib.sha256(before).hexdigest() == update['before'], 'Unexpected source revision: ' + str(target)
                rows = before.decode('utf-8').splitlines(keepends=True)
                for start, end, replacement in reversed(update['edits']):
                    assert 0 <= start <= end <= len(rows)
                    rows[start:end] = replacement.splitlines(keepends=True)
                data = ''.join(rows).encode('utf-8')
            assert hashlib.sha256(data).hexdigest() == update['after'], 'Modified source checksum mismatch: ' + str(target)
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(data)
        files = sorted((file for file in Path('fotokadr').rglob('*') if file.is_file()), key=str)
        assert len(files) == 45
        digest = hashlib.sha256()
        for file in files:
            data = file.read_bytes()
            digest.update(str(file).encode() + b'\0' + str(len(data)).encode() + b'\0' + data)
        assert digest.hexdigest() == 'c6db90192d498d4f56ec7b4b28eece15ba0c8e3658550524c4279b55f22b443e', 'FotoKadr 1.6.1 source checksum mismatch'
        with zipfile.ZipFile('fotokadr-source-1.6.1.zip', 'w', compression=zipfile.ZIP_DEFLATED) as output:
            for file in files: output.write(file, str(file))
        print('FotoKadr 1.6.1 theme source verified.')
        PY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore downloaded model and runtime
      uses: actions/cache@v4
      with:
        path: |-
          fotokadr/dist/models
          fotokadr/dist/vendor/onnxruntime
          fotokadr/dist/offline-assets.json
        key: fotokadr-modnet-yunet-ort-1.20.1-v2
        restore-keys: fotokadr-model-modnet-7e0f55f-ort-1.20.1-v1
    - name: Restore Android build tools
      uses: actions/cache@v4
      with:
        path: fotokadr/build/android-sdk
        key: fotokadr-sdk-35-tools-35.0.0-linux-v1
    - name: Download and verify offline model and runtime
      run: python scripts/fetch-offline-assets.py
    - name: Install verified Android build tools
      run: python scripts/setup-android-sdk.py --sdk build/android-sdk
    - name: Test editor, clothing library and offline model
      run: npm test
    - name: Prepare signing
      env:
        FOTOKADR_KEYSTORE_B64: ${{ secrets.FOTOKADR_KEYSTORE_B64 }}
        FOTOKADR_SIGNING_CONFIG_B64: ${{ secrets.FOTOKADR_SIGNING_CONFIG_B64 }}
      run: bash ../prepare-signing.sh
    - name: Build and verify signed offline APK
      run: python scripts/build-android.py --sdk build/android-sdk --signing-dir "$RUNNER_TEMP/fotokadr-signing" --output
        build/release
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-android-apk
        path: |-
          fotokadr/build/release/*.apk
          fotokadr/build/release/*.apk.sha256
        if-no-files-found: error
        retention-days: 30
    - name: Upload source archive
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-source-project
        path: fotokadr-source-1.6.1.zip
        if-no-files-found: error
        retention-days: 30
    defaults:
      run:
        working-directory: fotokadr
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/fotokadr-apk.yml
  pull_request:
    paths:
    - .github/workflows/fotokadr-apk.yml
concurrency:
  group: fotokadr-apk-${{ github.ref }}
  cancel-in-progress: true
