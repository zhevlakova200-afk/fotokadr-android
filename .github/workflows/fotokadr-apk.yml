# ФотоКадр 1.5.0: библиотека одежды и примерка без интернета.
# Замените .github/workflows/fotokadr-apk.yml целиком. Вставьте этот текст один раз.

name: FotoKadr 1.5.0 - clothing library
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 918ef38a4f77be7d11da6d495c1f55fbaf77d7ba
        fetch-depth: 0
    - name: Restore verified source and clothing library
      working-directory: .
      run: |
        python3 - <<'PY'
        from pathlib import Path, PurePosixPath
        import base64, hashlib, json, lzma, re, subprocess, textwrap, zipfile
        p = Path('.github/workflows/fotokadr-apk.yml')
        previous = p.read_text()
        signing = re.search(r'    - name: Prepare signing\n.*?      run: \|\n(.*?)(?=    - name:)', previous, re.S)[1]
        Path('prepare-signing.sh').write_text(textwrap.dedent(signing))
        script = textwrap.dedent(re.search(r'      run: \|\n(.*?)(?=    - uses:)', previous, re.S)[1])
        p.write_bytes(subprocess.check_output(['git', 'show', 'e741bbdafd6282e1883f69ef2d7e6cc287471ad6:.github/workflows/fotokadr-apk.yml']))
        subprocess.run(['bash', '-e', '-c', script], check=True)
        delta = """
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        uzslPpVxO+XbjRXzVS2A2iaGlvIRJMhejMqpBLSaHqso2e8a+ZSeI+mqaT9uL+gmHjUiYPUXawHx3YEhS9eEm9gxCjvEHxdMbL3ccUKsNN3FJGq/qi1QUYMreAB1JQXxOZ/K3QAB2FSuqwIAoZ0EurHEZ/sCAAAAAARZWg==
        """
        delta = base64.b64decode(''.join(delta.split()), validate=True)
        assert hashlib.sha256(delta).hexdigest() == '8c159465e6d83a1c42fd617007507b227babed4992d368e341c90301a2aaa03f', 'Update checksum mismatch'
        for update in json.loads(lzma.decompress(delta)):
            p = Path(update['path'])
            assert not p.is_absolute() and p.parts[0] == 'fotokadr' and '..' not in p.parts and '\\' not in str(p)
            if 'text' in update:
                assert not p.exists()
                text = update['text']
            else:
                lines = p.read_text().splitlines(keepends=True)
                for a, b, replacement in reversed(update['edits']):
                    assert 0 <= a <= b <= len(lines)
                    lines[a:b] = replacement.splitlines(keepends=True)
                text = ''.join(lines)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(text, encoding='utf-8')
        files = sorted((p for p in Path('fotokadr').rglob('*') if p.is_file()), key=str)
        assert len(files) == 41
        digest = hashlib.sha256()
        for p in files:
            data = p.read_bytes()
            digest.update(str(p).encode() + b'\0' + str(len(data)).encode() + b'\0' + data)
        assert digest.hexdigest() == 'f88502ffcf21f9638b3afab2687feed6fe74cc0685cb82d3e728df8d85c0e2bf', 'Source checksum mismatch'
        with zipfile.ZipFile('fotokadr-source-1.5.0.zip', 'w', compression=zipfile.ZIP_DEFLATED) as output:
            for p in files: output.write(p, str(p))
        print('FotoKadr 1.5.0 source verified: saved clothing templates and offline editor.')
        PY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Restore downloaded model and runtime
      uses: actions/cache@v4
      with:
        path: |-
          fotokadr/dist/models
          fotokadr/dist/vendor/onnxruntime
          fotokadr/dist/offline-assets.json
        key: fotokadr-model-modnet-7e0f55f-ort-1.20.1-v1
    - name: Restore Android build tools
      uses: actions/cache@v4
      with:
        path: fotokadr/build/android-sdk
        key: fotokadr-sdk-35-tools-35.0.0-linux-v1
    - name: Download and verify offline model and runtime
      run: python scripts/fetch-offline-assets.py
    - name: Install verified Android build tools
      run: python scripts/setup-android-sdk.py --sdk build/android-sdk
    - name: Test editor, clothing library and offline model
      run: npm test
    - name: Prepare signing
      env:
        FOTOKADR_KEYSTORE_B64: ${{ secrets.FOTOKADR_KEYSTORE_B64 }}
        FOTOKADR_SIGNING_CONFIG_B64: ${{ secrets.FOTOKADR_SIGNING_CONFIG_B64 }}
      run: bash ../prepare-signing.sh
    - name: Build and verify signed offline APK
      run: python scripts/build-android.py --sdk build/android-sdk --signing-dir "$RUNNER_TEMP/fotokadr-signing" --output
        build/release
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-android-apk
        path: |-
          fotokadr/build/release/*.apk
          fotokadr/build/release/*.apk.sha256
        if-no-files-found: error
        retention-days: 30
    - name: Upload source archive
      uses: actions/upload-artifact@v4
      with:
        name: fotokadr-source-project
        path: fotokadr-source-1.5.0.zip
        if-no-files-found: error
        retention-days: 30
    defaults:
      run:
        working-directory: fotokadr
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/fotokadr-apk.yml
concurrency:
  group: fotokadr-apk-${{ github.ref }}
  cancel-in-progress: true
  
