        chars=''.join(delta.split())
        assert all(0x4e00<=ord(c)<0x8e00 for c in chars), 'Invalid source package characters'
        bits=''.join(format(ord(c)-0x4e00,'014b') for c in chars)
        delta=bytes(int(bits[i:i+8],2) for i in range(0,14064*8,8))
        assert hashlib.sha256(delta).hexdigest() == '85d3f7b5fda977137dbdc4bf329cf361b7a4be3cc5fb0bb2134660b61e4ae6b2', 'Update checksum mismatch'
        for update in json.loads(lzma.decompress(delta)):
            p = Path(update['path'])
            assert not p.is_absolute() and p.parts[0] == 'fotokadr' and '..' not in p.parts and '\\' not in str(p)
            if 'text' in update:
                assert not p.exists()
                text = update['text']
            else:
                lines = p.read_text().splitlines(keepends=True)
                for a, b, replacement in reversed(update['edits']):
                    assert 0 <= a <= b <= len(lines)
                    lines[a:b] = replacement.splitlines(keepends=True)
                text = ''.join(lines)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(text, encoding='utf-8')
        files = sorted((p for p in Path('fotokadr').rglob('*') if p.is_file()), key=str)
        assert len(files) == 43
        digest = hashlib.sha256()
        for p in files:
            data = p.read_bytes()
            digest.update(str(p).encode() + b'\0' + str(len(data)).encode() + b'\0' + data)
        assert digest.hexdigest() == 'bf7c2a724d2d7df88f1269f525298d46546d5f0115af65ad98c0d75cf2a1f5a5', 'Source checksum mismatch'
        with zipfile.ZipFile('fotokadr-source-1.6.0.zip', 'w', compression=zipfile.ZIP_DEFLATED) as output:
            for p in files: output.write(p, str(p))
