        delta = base64.b64decode(''.join(delta.split()), validate=True)
        if hashlib.sha256(delta).hexdigest() != '74f77caaa334b641314e5ee9aeab403a799e946114ef1eddd60c086e75497e7d':
            raise SystemExit('Update checksum mismatch.')
        for update in json.loads(lzma.decompress(delta)):
            name = update['path']
            if not valid_path(name):
                raise SystemExit('Invalid update path.')
            if update['before'] is None:
                if name in files:
                    raise SystemExit('Unexpected existing source file.')
                data, mode = update['text'].encode('utf-8'), 0o644
            else:
                data, mode = files[name]
                if hashlib.sha256(data).hexdigest() != update['before']:
                    raise SystemExit('Unexpected source revision: ' + name)
                lines = data.decode('utf-8').splitlines(keepends=True)
                for start, end, replacement in reversed(update['edits']):
                    if not 0 <= start <= end <= len(lines):
                        raise SystemExit('Invalid update offsets.')
                    lines[start:end] = replacement.splitlines(keepends=True)
                data = ''.join(lines).encode('utf-8')
            if hashlib.sha256(data).hexdigest() != update['after']:
                raise SystemExit('Updated source checksum mismatch: ' + name)
            files[name] = (data, mode)
        if len(files) != 38:
            raise SystemExit('Updated project is incomplete.')
        if Path('fotokadr').exists():
            raise SystemExit('Output folder already exists.')
        with zipfile.ZipFile('fotokadr-source-1.4.1.zip', 'x', compression=zipfile.ZIP_DEFLATED) as output:
            for name, (data, mode) in sorted(files.items()):
                path = Path(name)
                path.parent.mkdir(parents=True, exist_ok=True)
                with path.open('xb') as handle:
                    handle.write(data)
                path.chmod(mode & 0o777)
                output.writestr(name, data)
        print('Restored FotoKadr 1.4.1: offline WASM loading fix and real-model tests.')
