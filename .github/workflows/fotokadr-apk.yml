# Содержит все исходники; дополнительные файлы загружать не нужно.
# При успешной сборке: Actions -> запуск -> Artifacts -> fotokadr-android-apk.
# Модель скачивается при сборке и включается в APK для работы офлайн.
# Без настроенных signing secrets ключ тестовой сборки временный.
# Исправлена компиляция Java: Java 8 API из JDK и Android SDK в classpath.

